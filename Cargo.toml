[workspace]
resolver = "2"
members = [
    "crates/onq-core",
    "crates/onq-app",
    "crates/onq-test-utils",
    "crates/onq-plugin-sdk",
]

[workspace.package]
version = "1.14.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/visorcraft/onQ"
rust-version = "1.95"

[workspace.dependencies]
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
# 9.0.0 is still a release candidate. 8.2 is the latest stable.
notify = "8"
# Dense ANN + replace_index. Keep aligned with MongrelDB releases on crates.io.
# `encryption` documents at-rest encrypted open/create. Kit is not a direct dep.
mongreldb-core = { version = "0.66.1", features = ["encryption"] }
onq-core = { path = "crates/onq-core", version = "1.14.2" }
onq-test-utils = { path = "crates/onq-test-utils", version = "1.14.2" }
keyring = { version = "4", features = [] }
argon2 = "0.6"
rand = "0.10"
base64 = "0.23"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "download-binaries", "tls-rustls"] }
hf-hub = { version = "1", features = ["rustls-tls"] }
# 1.0.0 is still a release candidate. 0.23 is the latest stable.
tokenizers = "0.23"
ndarray = "0.17"
diffy = "0.5"
sha2 = "0.11"
aes-gcm = "0.11"
libloading = "0.9"
onq-plugin-sdk = { path = "crates/onq-plugin-sdk", version = "1.14.2" }
tar = "0.4"
flate2 = "1"
toml = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
