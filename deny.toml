[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # --- historical GTK3 / webkit2gtk (Tauri Linux stack) ---
    "RUSTSEC-2024-0370",  # proc-macro-error — unmaintained; no safe upgrade
    "RUSTSEC-2024-0411",  # atk
    "RUSTSEC-2024-0412",  # atk-sys
    "RUSTSEC-2024-0413",  # gdk
    "RUSTSEC-2024-0414",  # gdk-pixbuf
    "RUSTSEC-2024-0415",  # gdk-pixbuf-sys
    "RUSTSEC-2024-0416",  # gdk-sys
    "RUSTSEC-2024-0417",  # gio
    "RUSTSEC-2024-0418",  # gio-sys
    "RUSTSEC-2024-0419",  # glib
    "RUSTSEC-2024-0420",  # glib-macros
    # --- transitive via hf-hub / tokenizers / mongreldb (no safe root upgrade) ---
    "RUSTSEC-2024-0436",  # paste — unmaintained; via tokenizers
    "RUSTSEC-2025-0141",  # bincode — unmaintained; via mongreldb-core
    # --- no patched release; recorded so `cargo deny` stays green ---
    "RUSTSEC-2026-0543",  # chrono — unmaintained; direct dep, no successor on crates.io
    "RUSTSEC-2026-0542",  # humantime — unmaintained; via hf-hub → xet-runtime
    "RUSTSEC-2024-0449",  # unsafe-libyaml — unmaintained; via serde_yaml 0.9 (last release)
    "RUSTSEC-2026-0371",  # zbus_names — unmaintained; via keyring 4 → zbus 5
    "RUSTSEC-2026-0370",  # zvariant — unmaintained; via keyring 4 → zbus 5
    "RUSTSEC-2026-0372",  # zvariant_derive — unmaintained; via keyring 4 → zbus 5
]

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Parallel versions come from the supported Tauri, WebKitGTK, Hugging Face,
# tokenizers, and MongrelDB dependency trees. Major deduplication needs root
# dependency upgrades, so this policy accepts them.
multiple-versions = "allow"
wildcards = "deny"
